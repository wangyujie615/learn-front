<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex两栏布局</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
        }
        
        .container {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 200px;
            background-color: #f0f0f0;
            flex-shrink: 0; /* 防止侧边栏被压缩 */
            padding: 20px;
            border-right: 1px solid #ddd;
        }
        
        .content {
            flex: 1; /* 占据剩余所有空间 */
            background-color: #fff;
            padding: 30px;
            overflow-y: auto; /* 内容超出时可滚动 */
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #ddd;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>侧边栏</h2>
            <ul>
                <li>菜单项 1</li>
                <li>菜单项 2</li>
                <li>菜单项 3</li>
                <li>菜单项 4</li>
                <li>菜单项 5</li>
            </ul>
        </div>
        <div class="content">
            <h1>主内容区</h1>
            <p>这是一个基于flex的两栏布局示例，左侧为固定宽度的侧边栏，右侧为主内容区，会根据屏幕宽度自动调整。</p>
            <p>尝试调整浏览器窗口的大小，可以看到右侧内容区会自动适应剩余空间。</p>
        </div>
    </div>
</body>
</html>
