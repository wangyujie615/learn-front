<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS品字布局实现</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        
        .pin-layout {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        /* 顶部盒子 */
        .top-box {
            background-color: #ff6b6b;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        /* 底部盒子容器 */
        .bottom-container {
            display: flex;
            gap: 20px;
            width: 100%;
        }
        
        /* 底部两个盒子 */
        .bottom-box {
            background-color: #4ecdc4;
            height: 200px;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        /* 为了更好的视觉效果 */
        .bottom-box:last-child {
            background-color: #45b7d1;
        }
        
        /* 响应式调整 */
        @media (max-width: 600px) {
            .bottom-container {
                flex-direction: column;
            }
            
            .top-box, .bottom-box {
                height: 150px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <h1>CSS品字布局实现</h1>
    
    <div class="pin-layout">
        <!-- 顶部盒子 -->
        <div class="top-box">顶部盒子</div>
        
        <!-- 底部两个盒子 -->
        <div class="bottom-container">
            <div class="bottom-box">左下盒子</div>
            <div class="bottom-box">右下盒子</div>
        </div>
    </div>
</body>
</html>
